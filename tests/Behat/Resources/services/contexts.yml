services:
    waaz.fedex_plugin.behat.context.ui.admin.shipping_gateway:
        class: Tests\Waaz\SyliusFedexPlugin\Behat\Context\Ui\Admin\ShippingGatewayContext
        public: true
        arguments:
            - '@waaz.fedex_plugin.behat.page.admin.shipping_gateway.create'
            - '@sylius.behat.current_page_resolver'
            - '@sylius.behat.notification_checker'

    waaz.fedex_plugin.behat.context.setup.shipping_gateway:
        class: Tests\Waaz\SyliusFedexPlugin\Behat\Context\Setup\ShippingGatewayContext
        public: true
        arguments:
            - '@sylius.product_variant_resolver.default'
            - '@sylius.repository.order'
            - '@sylius.repository.shipment'
            - '@doctrine.orm.entity_manager'
            - '@sylius.behat.shared_storage'

    waaz.fedex_plugin.behat.context.ui.admin.shipping_export:
        class: Tests\Waaz\SyliusFedexPlugin\Behat\Context\Ui\Admin\ShippingExportContext
        public: true
        arguments:
            - '@bitbag.behat.page.admin.shipping_export.index'
            - '@waaz.fedex_plugin.behat.mocker.fedex_api_mocker'

    waaz.fedex_plugin.behat.context.ui.shop.shipping_address:
        class: Tests\Waaz\SyliusFedexPlugin\Behat\Context\Ui\Shop\ShippingAddressContext
        public: true
        arguments:
            - '@sylius.behat.page.shop.checkout.address'

    waaz.fedex_plugin.behat.context.setup.shipping_method:
        class: Tests\Waaz\SyliusFedexPlugin\Behat\Context\Setup\ShippingContext
        public: true
        arguments:
            - '@setono_sylius_pickup_point.registry.provider'
            - '@sylius.manager.shipping_method'

    waaz.fedex_plugin.behat.context.ui.shop.shipping:
        class: Tests\Waaz\SyliusFedexPlugin\Behat\Context\Ui\Shop\ShippingContext
        public: true
        arguments:
            - '@waaz.fedex_plugin.page.shop.select_shipping'
            - '@sylius.behat.page.shop.checkout.complete'
            - '@sylius.behat.shared_storage'
            - '@sylius.repository.order'
    
    waaz.fedex_plugin.page.shop.select_shipping: 
        class: Tests\Waaz\SyliusFedexPlugin\Behat\Page\Shop\ShippingPickup\SelectShippingPage
        parent: sylius.behat.page.shop.checkout.select_shipping
        public: false
